    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 70) rotate(132) scale(520 640)">
      <stop stop-color="#d4af37" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.26"/>
