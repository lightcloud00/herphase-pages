      <path d="M870 292 L919 341 L1018 229" fill="none" stroke="#f6dcea" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1060" cy="125" r="31" fill="#d4af37" fill-opacity="0.95"/></g>
  <rect x="76" y="72" width="82" height="7" rx="3.5" fill="#d4af37"/>
