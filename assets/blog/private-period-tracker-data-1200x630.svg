  <text x="76" y="242" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="49" font-weight="800">Private Period Tracking:</text>
  <text x="76" y="302" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="49" font-weight="800">What Stays on Your Phone</text>
