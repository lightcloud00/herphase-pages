<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Private Period Tracking: What Stays on Your Phone and Why</title>
  <desc id="description">HerPhase cover with a protective shield representing private on-device period tracking data</desc>
  <defs>
