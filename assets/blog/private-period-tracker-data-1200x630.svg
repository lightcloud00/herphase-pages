  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <path d="M0 532 C225 456 414 595 650 526 C858 466 1014 414 1200 468 V630 H0 Z" fill="#ffffff" fill-opacity="0.055"/>
